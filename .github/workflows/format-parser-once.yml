name: One-time parser formatting

on:
  push:
    branches:
      - milestone/parser-regression-coverage-2026-11-15

permissions:
  contents: write

jobs:
  format-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit formatted parser
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler/src/parser.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(parser): apply rustfmt formatting"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Check compilation
        run: cargo check --all-targets
