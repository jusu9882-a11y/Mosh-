name: One-time parser formatting repair

on:
  push:
    branches:
      - milestone/parser-regression-coverage-2026-11-15

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/parser-regression-coverage-2026-11-15
      - uses: dtolnay/rust-toolchain@stable
      - name: Format all Rust sources
        run: cargo fmt --all
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compiler
          if ! git diff --cached --quiet; then
            git commit -m "style: format Rust sources after parser recovery"
            git push
          fi
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Run all tests
        run: cargo test --all-targets
      - name: Check all targets
        run: cargo check --all-targets
