name: Rust compiler checks

on:
  push:
    paths:
      - "compiler/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "compiler/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --all-targets
      - name: Check compilation
        run: cargo check --all-targets
      - name: Run collections example
        run: cargo run --bin mosh -- run ../examples/collections.mosh
      - name: Smoke-test multiline REPL
        shell: bash
        run: |
          output=$(printf 'mut n = 0\nwhile n < 2:\n    n = n + 1\n\nn\n:quit\n' | cargo run --quiet --bin mosh)
          printf '%s\n' "$output"
          grep -q '2
 <<< "$output"
