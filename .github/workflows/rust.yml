name: Rust compiler checks

on:
  push:
    paths:
      - "compiler/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "compiler/**"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting for all Rust sources
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Check compilation
        run: cargo check --all-targets
      - name: Build and run the Mosh hello-world example
        run: |
          cargo build --release
          ./target/release/moshc build ../examples/hello.mosh -o target/hello
          output="$(./target/hello)"
          test "$output" = "Hello, Mosh!"
      - name: Build and run the Mosh control-flow example
        run: |
          ./target/release/moshc build ../examples/control_flow.mosh -o target/control-flow
          output="$(./target/control-flow)"
          test "$output" = "sum=15"
      - name: Upload Linux compiler preview
        uses: actions/upload-artifact@v4
        with:
          name: mosh-compiler-preview-linux-x86_64
          path: |
            compiler/target/release/moshc
            README.md
            docs/SPECIFICATION.md
            examples/*.mosh
          if-no-files-found: error
          retention-days: 7
