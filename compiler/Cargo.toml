[package]
name = "moshc"
version = "0.1.0"
edition = "2021"
description = "The Mosh interpreted programming language runtime"
license = "UNLICENSED"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "moshc"
path = "src/main.rs"

[[bin]]
name = "mosh"
path = "src/main.rs"

[dependencies]
jni = "0.21"
serde_json = "1"
